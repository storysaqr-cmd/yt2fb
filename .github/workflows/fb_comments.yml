name: fb_comments
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: comment replies
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python fb_comments.py
      - name: save state
        run: |
          git config user.name "fb_comments"
          git config user.email "fb_comments@users.noreply.github.com"
          git add comments_state.json || true
          git add PREVIEWS.md || true
          git add SKIPPED.md || true
          git diff --cached --quiet || (git commit -m "state" && git push)
